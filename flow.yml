                            parts = line.split()
                            user = int(parts[1])
                            nice = int(parts[2])
                            system = int(parts[3])
                            idle = int(parts[4])
                            total = user + nice + system + idle
                            return round(((total - idle) / total) * 100, 2) if total > 0 else 0
                    except:
                        return 0

                def get_memory_mb():
                    try:
                        with open('/proc/self/status', 'r') as f:
                            for line in f:
                                if line.startswith('VmRSS:'):
                                    kb = int(line.split()[1])
                                    return round(kb / 1024, 2)
                    except:
                        return 0

