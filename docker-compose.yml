x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-20m}"
    max-file: "${LOG_MAX_FILE:-10}"
    compress: "true"

services:
  # ============================================
  # WINDMILL SERVICES
  # ============================================
  
  db:
    image: postgres:16
    shm_size: 1g
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - 5432
    environment:
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: windmill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - windmill_network

  windmill_server:
    image: ${WM_IMAGE:-ghcr.io/windmill-labs/windmill:main}
    pull_policy: always
    deploy:
      replicas: 1
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "2525:2525"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:changeme@db/windmill?sslmode=disable}
      - MODE=server
      - ENABLE_PROMETHEUS=true
      - PROMETHEUS_MULTIPROC_DIR=/tmp/windmill/prometheus
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel_collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_SERVICE_NAME=windmill-server
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - worker_logs:/tmp/windmill/logs
      - ./scripts:/tmp/windmill/scripts
      - ./data:/data
      - prometheus_data:/tmp/windmill/prometheus
    logging: *default-logging
    networks:
      - windmill_network

  windmill_worker:
    image: ${WM_IMAGE:-ghcr.io/windmill-labs/windmill:main}
    pull_policy: always
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2048M
    restart: unless-stopped
    privileged: true
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:changeme@db/windmill?sslmode=disable}
      - MODE=worker
      - WORKER_GROUP=default
      - FAVOR_UNSHARE_PID=true
      - ENABLE_PROMETHEUS=true
      - PROMETHEUS_MULTIPROC_DIR=/tmp/windmill/prometheus
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel_collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_SERVICE_NAME=windmill-worker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - worker_dependency_cache:/tmp/windmill/cache
      - worker_logs:/tmp/windmill/logs
      - ./scripts:/tmp/windmill/scripts
      - ./data:/data
      - prometheus_data:/tmp/windmill/prometheus
    logging: *default-logging
    networks:
      - windmill_network

  windmill_worker_native:
    image: ${WM_IMAGE:-ghcr.io/windmill-labs/windmill:main}
    pull_policy: always
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2048M
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:changeme@db/windmill?sslmode=disable}
      - MODE=worker
      - WORKER_GROUP=native
      - NATIVE_MODE=true
      - SLEEP_QUEUE=200
      - ENABLE_PROMETHEUS=true
      - PROMETHEUS_MULTIPROC_DIR=/tmp/windmill/prometheus
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel_collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_SERVICE_NAME=windmill-worker-native
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - worker_logs:/tmp/windmill/logs
      - ./scripts:/tmp/windmill/scripts
      - ./data:/data
      - prometheus_data:/tmp/windmill/prometheus
    logging: *default-logging
    networks:
      - windmill_network

  windmill_extra:
    image: ghcr.io/windmill-labs/windmill-extra:latest
    pull_policy: always
    restart: unless-stopped
    expose:
      - 3001
      - 3002
      - 3003
    environment:
      - ENABLE_LSP=true
      - ENABLE_MULTIPLAYER=false
      - ENABLE_DEBUGGER=true
      - DEBUGGER_PORT=3003
      - ENABLE_NSJAIL=false
      - REQUIRE_SIGNED_DEBUG_REQUESTS=false
      - WINDMILL_BASE_URL=http://windmill_server:8000
    volumes:
      - lsp_cache:/pyls/.cache
      - ./data:/data
    logging: *default-logging
    networks:
      - windmill_network

  caddy:
    image: ghcr.io/windmill-labs/caddy-l4:latest
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    ports:
      - "80:80"
      - "25:25"
    environment:
      - BASE_URL=":80"
    logging: *default-logging
    networks:
      - windmill_network

  # ============================================
  # MONGODB - Stockage des données
  # ============================================
  
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: data_pipeline
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017 --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - windmill_network

  # ============================================
  # OBSERVABILITÉ - OpenTelemetry Stack
  # ============================================
  
  otel_collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"
      - "4319:4318"
      - "8890:8890"
    depends_on:
      - prometheus
      - tempo
    logging: *default-logging
    networks:
      - windmill_network

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    logging: *default-logging
    networks:
      - windmill_network

  tempo:
    image: grafana/tempo:latest
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yml
      - tempo_data:/var/tempo
    user: "10001:10001"
    ports:
      - "3200:3200"
      - "55680:55680"
    logging: *default-logging
    networks:
      - windmill_network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    logging: *default-logging
    networks:
      - windmill_network

# ============================================
# VOLUMES
# ============================================
volumes:
  db_data: null
  worker_dependency_cache: null
  worker_logs: null
  lsp_cache: null
  caddy_data: null
  mongodb_data: null
  prometheus_data: null
  tempo_data: null
  grafana_data: null

# ============================================
# NETWORKS
# ============================================
networks:
  windmill_network:
    driver: bridge